version: '3.8'

# NOTE ON PORTS: the master overview doc says the frontend runs on 5173
# (Vite dev server) and health_check.py also checks 5173 — but the
# original docker-compose mapped it to 3000:80 instead, which would make
# health_check.py fail against a Dockerized build. This file keeps 5173
# everywhere for consistency. If Member 5 ends up serving a production
# build through Nginx instead of the Vite dev server, change BOTH the
# "frontend" service below AND SERVICES["Frontend (M5)"] in health_check.py
# together — don't let them drift again.

services:
  # ===== DATABASES =====
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: criminal_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.13
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/criminal123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "criminal123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # ===== BACKEND SERVICES =====
  backend:                          # Member 1
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/criminal_db
      - MONGO_URL=mongodb://mongodb:27017/criminal_docs
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../uploads:/app/uploads

  nlp_service:                      # Member 2
    build: ../nlp_service
    ports:
      - "8001:8001"
    depends_on:
      - backend

  graph_service:                    # Member 3
    build: ../graph_service
    ports:
      - "8002:8002"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=criminal123
    depends_on:
      neo4j:
        condition: service_healthy

  analysis_service:                 # Member 4
    build: ../analysis_service
    ports:
      - "8003:8003"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=criminal123
    depends_on:
      - graph_service

  ai_service:                       # Member 6 (this service)
    build: ..
    ports:
      - "8004:8004"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPH_API=http://graph_service:8002
      - ANALYSIS_API=http://analysis_service:8003
      - BACKEND_API=http://backend:8000
    depends_on:
      - graph_service
      - analysis_service

  # ===== FRONTEND =====
  frontend:                         # Member 5
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - graph_service

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
