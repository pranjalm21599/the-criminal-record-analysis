version: '3.8'
services:
  neo4j:
    image: neo4j:5.13
    ports:
      - "7474:7474"   # Web browser UI
      - "7687:7687"   # Bolt protocol (for Python)
    environment:
      NEO4J_AUTH: neo4j/criminal123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
volumes:
  neo4j_data:
  neo4j_logs: